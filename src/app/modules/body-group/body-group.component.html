<div class="grid">
	<div class="col-12">
		<div class="card px-6 py-6">
			<p-toast></p-toast>
			<p-toolbar styleClass="mb-4">
				<ng-template pTemplate="left">
				</ng-template>
				<ng-template pTemplate="right">
					<div class="my-2">
						<button pButton pRipple label="Novo" icon="pi pi-plus" class="p-button-success mr-2" (click)="openNew()"></button>
						<button pButton pRipple label="Deletar selecionados" icon="pi pi-trash" class="p-button-danger" (click)="deleteSelectedBodyGroups()" [disabled]="!selectedBodyGroups || !selectedBodyGroups.length"></button>
					</div>
				</ng-template>
			</p-toolbar>

			<p-table #dt
					 [value]="bodyGroups"
					 [columns]="cols"
					 responsiveLayout="scroll"
					 [rows]="10"
					 [globalFilterFields]="['id','name','status']"
					 [paginator]="true"
					 [rowsPerPageOptions]="rowsPerPageOptions"
					 [showCurrentPageReport]="true"
					 currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
					 [(selection)]="selectedBodyGroups"
					 selectionMode="multiple"
					 [rowHover]="true"
					 dataKey="id"
			>
				<ng-template pTemplate="caption">
					<div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
						<h5 class="m-0">Grupos musculares</h5>
						<span class="block mt-2 md:mt-0 p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Buscar..." class="w-full sm:w-auto"/>
                        </span>
					</div>
				</ng-template>
				<ng-template pTemplate="header">
					<tr>
						<th style="width: 3rem">
							<p-tableHeaderCheckbox></p-tableHeaderCheckbox>
						</th>
						<th pSortableColumn="id">
							ID
							<p-sortIcon field="id"></p-sortIcon>
						</th>
						<th pSortableColumn="name">
							Nome
							<p-sortIcon field="name"></p-sortIcon>
						</th>
						<th pSortableColumn="status">
							Status
							<p-sortIcon field="status"></p-sortIcon>
						</th>
						<th></th>
					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-bodyGroup>
					<tr>
						<td>
							<p-tableCheckbox [value]="bodyGroup"></p-tableCheckbox>
						</td>
						<td style="width:5%; min-width:5rem;">
							<span class="p-column-title">ID</span>
							{{ bodyGroup.id }}
						</td>
						<td style="width:14%; min-width:10rem;">
							<span class="p-column-title">Nome</span>
							{{ bodyGroup.name }}
						</td>
						<td style="width:14%; min-width: 10rem;">
							<span class="p-column-title">Status</span>
							<span [class]="'status-badge status-' + (bodyGroup.status === 'A' ? 'active' : 'inactive')">{{ bodyGroup.status === 'A' ? 'ATIVO' : 'INATIVO' }}</span>
						</td>
						<td>
							<div class="flex">
								<button pButton pRipple icon="pi pi-eye" class="p-button-rounded p-button-default mr-2" (click)="viewBodyGroup(bodyGroup)"></button>
								<button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" (click)="editBodyGroup(bodyGroup)"></button>
								<button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-danger" (click)="deleteBodyGroup(bodyGroup)"></button>
							</div>
						</td>
					</tr>
				</ng-template>
			</p-table>
		</div>

		<p-dialog [(visible)]="deleteBodyGroupDialog" header="Confirmar" [modal]="true" [style]="{width:'450px'}">
			<div class="flex align-items-center justify-content-center">
				<i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
				<span *ngIf="bodyGroup"> Tem certeza de que deseja excluir <b>{{bodyGroup.name}}</b>?</span>
			</div>
			<ng-template pTemplate="footer">
				<button pButton pRipple icon="pi pi-times" class="p-button-text" label="Não" (click)="deleteBodyGroupDialog = false"></button>
				<button pButton pRipple icon="pi pi-check" class="p-button-text" label="Sim" (click)="confirmDelete()"></button>
			</ng-template>
		</p-dialog>

		<p-dialog [(visible)]="deleteBodyGroupsDialog" header="Confirmar" [modal]="true" [style]="{width:'450px'}">
			<div class="flex align-items-center justify-content-center">
				<i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
				<span>Tem certeza de que deseja excluir os grupos musculares selecionados?</span>
			</div>
			<ng-template pTemplate="footer">
				<button pButton pRipple icon="pi pi-times" class="p-button-text" label="Não" (click)="deleteBodyGroupsDialog = false"></button>
				<button pButton pRipple icon="pi pi-check" class="p-button-text" label="Sim" (click)="confirmDeleteSelected()"></button>
			</ng-template>
		</p-dialog>
	</div>
</div>
