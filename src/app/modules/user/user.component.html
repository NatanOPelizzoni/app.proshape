<div class="grid">
	<div class="col-12">
		<div class="card px-6 py-6">
			<p-toast></p-toast>
			<p-toolbar styleClass="mb-4">
				<ng-template pTemplate="left">
					<div class="my-2">
						<button pButton pRipple label="Novo" icon="pi pi-plus" class="p-button-success mr-2"></button>
						<button pButton pRipple label="Deletar" icon="pi pi-trash" class="p-button-danger" (click)="deleteSelectedProducts()" [disabled]="!selectedUsers || !selectedUsers.length"></button>
					</div>
				</ng-template>
			</p-toolbar>

			<p-table #dt
				[value]="users"
				[columns]="cols"
				responsiveLayout="scroll"
				[rows]="10"
				[globalFilterFields]="['id','name','email','status']"
				[paginator]="true"
				[rowsPerPageOptions]="rowsPerPageOptions"
				[showCurrentPageReport]="true"
				currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
				[(selection)]="selectedUsers"
				selectionMode="multiple"
				[rowHover]="true"
				dataKey="id"
			>
				<ng-template pTemplate="caption">
					<div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
						<h5 class="m-0">Usuários</h5>
						<span class="block mt-2 md:mt-0 p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Buscar..." class="w-full sm:w-auto"/>
                        </span>
					</div>
				</ng-template>
				<ng-template pTemplate="header">
					<tr>
						<th style="width: 3rem">
							<p-tableHeaderCheckbox></p-tableHeaderCheckbox>
						</th>
						<th pSortableColumn="id">
							ID
							<p-sortIcon field="id"></p-sortIcon>
						</th>
						<th pSortableColumn="name">
							Nome
							<p-sortIcon field="name"></p-sortIcon>
						</th>
						<th pSortableColumn="email">
							Email
							<p-sortIcon field="email"></p-sortIcon>
						</th>
						<th pSortableColumn="active">
							Status
							<p-sortIcon field="active"></p-sortIcon>
						</th>
						<th></th>
					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-user>
					<tr>
						<td>
							<p-tableCheckbox [value]="user"></p-tableCheckbox>
						</td>
						<td style="width:14%; min-width:10rem;"><span class="p-column-title">ID</span>
							{{ user.id }}
						</td>
						<td style="width:14%; min-width:10rem;">
							<span class="p-column-title">Name</span>
							{{ user.name }}
						</td>
						<td style="width:14%; min-width:10rem;">
							<span class="p-column-title">Email</span>
							{{ user.email }}
						</td>
						<td style="width:14%; min-width: 10rem;"><span class="p-column-title">Status</span>
							<span [class]="'product-badge status-' + (user.active ? 'active' : 'inactive')">{{ user.active ? 'ATIVO' : 'INATIVO' }}</span>
						</td>
						<td>
							<div class="flex">
								<button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" (click)="editUser(user)"></button>
								<button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning" (click)="deleteUser(user)"></button>
							</div>
						</td>
					</tr>
				</ng-template>
			</p-table>
		</div>

		<p-dialog [(visible)]="deleteUserDialog" header="Confirmar" [modal]="true" [style]="{width:'450px'}">
			<div class="flex align-items-center justify-content-center">
				<i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
				<span *ngIf="user"> Tem certeza de que deseja excluir <b>{{user.name}}</b>?</span>
			</div>
			<ng-template pTemplate="footer">
				<button pButton pRipple icon="pi pi-times" class="p-button-text" label="Não" (click)="deleteUserDialog = false"></button>
				<button pButton pRipple icon="pi pi-check" class="p-button-text" label="Sim" (click)="confirmDelete()"></button>
			</ng-template>
		</p-dialog>

		<p-dialog [(visible)]="deleteUsersDialog" header="Confirmar" [modal]="true" [style]="{width:'450px'}">
			<div class="flex align-items-center justify-content-center">
				<i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
				<span>Tem certeza de que deseja excluir os usuários selecionados?</span>
			</div>
			<ng-template pTemplate="footer">
				<button pButton pRipple icon="pi pi-times" class="p-button-text" label="Não" (click)="deleteUsersDialog = false"></button>
				<button pButton pRipple icon="pi pi-check" class="p-button-text" label="Sim" (click)="confirmDeleteSelected()"></button>
			</ng-template>
		</p-dialog>
	</div>
</div>
