<div class="grid">
	<div class="col-12">
		<div class="card px-6 py-6">
			<p-toast></p-toast>
			<p-toolbar styleClass="mb-4">
				<ng-template pTemplate="left">
				</ng-template>
				<ng-template pTemplate="right">
					<div class="my-2">
						<button pButton pRipple label="Voltar" icon="pi pi-arrow-left" class="p-button-default mr-2" (click)="backToList($event)" ></button>
						<button pButton pRipple label="Salvar" icon="pi pi-save" class="p-button-success" [disabled]="readonly && form.invalid" (click)="save()" ></button>
					</div>
				</ng-template>
			</p-toolbar>

			<div class="col-12">
				<form [formGroup]="form">
					<div class="card">
						<h5>{{ headerTitle }}</h5>
						<div class="p-fluid p-formgrid grid">
							<div class="field col-12 md:col-6">
								<label htmlFor="name">Nome *</label>
								<input [readonly]="readonly" [required]="true" formControlName="name" pInputText id="name" type="text" />
							</div>
							<div class="field col-12 md:col-6">
								<label htmlFor="email">E-mail *</label>
								<input [readonly]="readonly" [required]="true" formControlName="email" pInputText id="email" type="text" />
							</div>
							<div class="field col-12 md:col-3">
								<label htmlFor="status">Status *</label>
								<p-dropdown [readonly]="readonly" [required]="true" formControlName="status" [options]="dropdownStatus" placeholder="Selecione um status" [showClear]="true" optionValue="value" optionLabel="description"></p-dropdown>
							</div>
							<div class="field col-12 md:col-3">
								<label htmlFor="role_id">Permissão *</label>
								<p-dropdown [readonly]="readonly" [required]="true" formControlName="role_id" [options]="dropdownRoles" placeholder="Selecione uma permissão" [showClear]="true" optionValue="value" optionLabel="description"></p-dropdown>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
