<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
	<div class="flex flex-column align-items-center justify-content-center">
		<img ngSrc="assets/layout/images/logo/svg/proshape_vertical_logo_dark.svg" priority alt="Pro Shape logo" class="mb-5 w-7rem flex-shrink-0" width="172" height="150" style="height: auto;">
		<div class="login-container">
			<p-toast></p-toast>
			<div class="inside-login-container w-full surface-card py-8 px-5 sm:px-8">
				<div class="text-center mb-5">
					<div class="text-900 text-3xl font-medium mb-3">Bem-vindo(a) ao Pro Shape!</div>
					<span class="text-600 font-medium">Faça login para continuar!</span>
				</div>

				<form [formGroup]="form">
					<div>
						<div class="field">
							<label htmlFor="email" class="block text-900 text-xl font-medium mb-2">E-mail</label>
							<input [required]="true" formControlName="email" pInputText id="email" type="text" placeholder="Endereço de e-mail" class="email-input w-full md:w-30rem mb-5">
							<small class="p-error block"
								   *ngIf="form.get('email')?.invalid && form.get('email')?.dirty"
							>
								E-mail é obrigatório!
							</small>
						</div>

						<div class="field">
							<label htmlFor="password" class="block text-900 font-medium text-xl mb-2">Senha</label>
							<p-password id="password" formControlName="password" placeholder="Senha" [toggleMask]="true" [showClear]="true" [feedback]="false" styleClass="mb-5" inputStyleClass="w-full p-3 md:w-30rem"></p-password>
							<small class="p-error block"
								   *ngIf="form.get('password')?.invalid && form.get('password')?.dirty"
							>
								Senha é obrigatória!
							</small>
						</div>

						<div class="flex align-items-center justify-content-end mb-5 gap-5">
							<a class="forgot-password-text font-medium no-underline ml-2 text-right cursor-pointer">Esqueceu a senha?</a>
						</div>
						<button pButton pRipple [disabled]="form.invalid" label="Entrar" class="w-full p-3 text-xl" (click)="login()"></button>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
